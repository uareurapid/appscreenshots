<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d8c9bc"/><stop offset="50%" stop-color="#cfbeb1"/><stop offset="100%" stop-color="#bfa890"/></linearGradient>
    <radialGradient id="h1" cx="0.2" cy="0.25" r="0.35"><stop offset="0%" stop-color="white" stop-opacity="0.15"/><stop offset="100%" stop-color="white" stop-opacity="0"/></radialGradient>
    <radialGradient id="h2" cx="0.75" cy="0.6" r="0.3"><stop offset="0%" stop-color="white" stop-opacity="0.1"/><stop offset="100%" stop-color="white" stop-opacity="0"/></radialGradient>
    <radialGradient id="h3" cx="0.5" cy="0.7" r="0.25"><stop offset="0%" stop-color="white" stop-opacity="0.08"/><stop offset="100%" stop-color="white" stop-opacity="0"/></radialGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="black" opacity="0.03"/>
      <rect x="2" y="1" width="1" height="1" fill="black" opacity="0.02"/>
      <rect x="1" y="3" width="1" height="1" fill="black" opacity="0.04"/>
      <rect x="3" y="2" width="1" height="1" fill="black" opacity="0.03"/>
    </pattern>
    <pattern id="grain2" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2" width="1" height="1" fill="white" opacity="0.04"/>
      <rect x="4" y="0" width="1" height="1" fill="white" opacity="0.03"/>
      <rect x="2" y="5" width="1" height="1" fill="black" opacity="0.02"/>
      <rect x="5" y="3" width="1" height="1" fill="black" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1290" height="2796" fill="url(#bg)"/>
  <!-- Painterly texture -->
  <rect width="1290" height="2796" fill="url(#grain)"/>
  <rect width="1290" height="2796" fill="url(#grain2)"/>
  <!-- Soft sculpted light -->
  <circle cx="258" cy="700" r="600" fill="url(#h1)"/>
  <circle cx="968" cy="1680" r="500" fill="url(#h2)"/>
  <circle cx="645" cy="1960" r="400" fill="url(#h3)"/>
