<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#070b10"/><stop offset="35%" stop-color="#0f1823"/><stop offset="65%" stop-color="#0d1b2e"/><stop offset="100%" stop-color="#071018"/></linearGradient>
    <linearGradient id="haze1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/><stop offset="50%" stop-color="#3b82f6" stop-opacity="0.06"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient>
    <linearGradient id="haze2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/><stop offset="50%" stop-color="#3b82f6" stop-opacity="0.08"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient>
    <linearGradient id="haze3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/><stop offset="50%" stop-color="#3b82f6" stop-opacity="0.05"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient>
    <linearGradient id="beam" x1="0.4" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="rgba(96,165,250,0.3)"/><stop offset="30%" stop-color="#60a5fa" stop-opacity="0.06"/><stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>
  <rect width="1290" height="2796" fill="url(#bg)"/>
  <!-- Atmospheric haze bands -->
  <rect y="400" width="1290" height="500" fill="url(#haze1)" filter="url(#blur)"/>
  <rect y="1000" width="1290" height="500" fill="url(#haze2)" filter="url(#blur)"/>
  <rect y="1700" width="1290" height="500" fill="url(#haze3)" filter="url(#blur)"/>
  <!-- Dramatic light beam -->
  <rect width="1290" height="2796" fill="url(#beam)"/>
  <!-- Dark vignette edge glow -->
  <circle cx="645" cy="1400" r="600" fill="none" stroke="#1e3a5f" stroke-width="400" opacity="0.05" filter="url(#blur)"/>
  <!-- Particles -->
  <circle cx="150" cy="300" r="2.5" fill="#93c5fd" opacity="0.2"/><circle cx="850" cy="180" r="1.5" fill="#93c5fd" opacity="0.15"/>
  <circle cx="450" cy="500" r="3" fill="#93c5fd" opacity="0.18"/><circle cx="1100" cy="600" r="2" fill="#93c5fd" opacity="0.22"/>
  <circle cx="200" cy="800" r="3.5" fill="#93c5fd" opacity="0.15"/><circle cx="680" cy="700" r="1.5" fill="#93c5fd" opacity="0.2"/>
  <circle cx="350" cy="1000" r="2" fill="#93c5fd" opacity="0.18"/><circle cx="950" cy="950" r="3" fill="#93c5fd" opacity="0.15"/>
  <circle cx="100" cy="1300" r="2" fill="#93c5fd" opacity="0.2"/><circle cx="550" cy="1200" r="4" fill="#93c5fd" opacity="0.12"/>
  <circle cx="800" cy="1400" r="2.5" fill="#93c5fd" opacity="0.18"/><circle cx="1150" cy="1500" r="1.5" fill="#93c5fd" opacity="0.2"/>
  <circle cx="250" cy="1700" r="3" fill="#93c5fd" opacity="0.15"/><circle cx="650" cy="1800" r="2" fill="#93c5fd" opacity="0.2"/>
  <circle cx="900" cy="1900" r="2.5" fill="#93c5fd" opacity="0.15"/><circle cx="400" cy="2100" r="3" fill="#93c5fd" opacity="0.12"/>
  <circle cx="1050" cy="2200" r="2" fill="#93c5fd" opacity="0.18"/><circle cx="150" cy="2400" r="2.5" fill="#93c5fd" opacity="0.15"/>
  <circle cx="550" cy="2500" r="3" fill="#93c5fd" opacity="0.12"/><circle cx="850" cy="2600" r="1.5" fill="#93c5fd" opacity="0.18"/>
  <!-- Subtle horizon -->
  <line x1="0" y1="1540" x2="1290" y2="1540" stroke="#3b82f6" stroke-width="2" opacity="0.08"/>
</svg>